[probe_eddy_current fly_eddy_probe]
sensor_type: ldc1612
i2c_address: 43
i2c_mcu: SB2040
i2c_bus: i2c1b
x_offset: 0     # remember to set x offset
y_offset: 21.42 # remember to set y offset 
z_offset: 2     # remember to set z offset
i2c_speed: 4000000

[temperature_probe fly_eddy_probe]
sensor_type: Generic 3950
sensor_pin:SB2040:gpio28
horizontal_move_z: 2

[printer]
kinematics: corexy
max_velocity: 400  
max_accel:  4000	   
minimum_cruise_ratio: 0.5
max_z_velocity: 30			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 400
square_corner_velocity: 5.0

#[safe_z_home]
#home_xy_position: 125, 125
#speed: 100.0
#z_hop: 5.0
#z_hop_speed: 15.0
#move_to_previous: False #True


#####################################################################
#      X/Y/Z Stepper Settings
#####################################################################
[stepper_x]
# Connected to X-MOT (B Motor) 
step_pin: PE11
dir_pin: !PE10
enable_pin: !PE9
rotation_distance: 40
microsteps: 128
full_steps_per_rotation:200  
#endstop_pin: !PB14 # Hall
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 249.5
position_max: 250.5
homing_speed: 80
homing_retract_dist: 0 #sensorless homing
#homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
# Connected to Y-MOT (A Motor) #Eingesteckt in Y position
step_pin: PD8
dir_pin: !PB12
enable_pin: !PD9
rotation_distance: 40
microsteps: 128
full_steps_per_rotation:200  
#endstop_pin: !PB13 # Hall
endstop_pin:tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 260
position_max: 260.1
homing_speed: 80
homing_retract_dist: 0 #sensorless homing
#homing_retract_dist: 5
homing_positive_dir: true


[stepper_z]
# Z Stepper - Front left  In Z_MOT Position
step_pin: PD14
dir_pin: PD13
enable_pin: !PD15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128
# endstop_pin: ^PA0 #Z-endstop 
#position_endstop: -0.26
endstop_pin: probe:z_virtual_endstop

position_max: 200
position_min: -5
homing_speed: 15
second_homing_speed: 2
homing_retract_dist: 2
[stepper_z1]
# Z1 Stepper - Rear left In E0-MOT Position
step_pin: PD5 
dir_pin: !PD6
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128
[stepper_z2]
# Z2 Stepper - Rear right In E1-MOT Position
step_pin: PE6
dir_pin: PC13
enable_pin: !PE5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128
[stepper_z3]
## Z3 Stepper - Front right # In E2-MOT Position
step_pin: PE2
dir_pin: !PE4
enable_pin: !PE3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128


